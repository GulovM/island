[package]
name = "island"
version = "1.9.1"
edition = "2021"
description = "Dynamic island for macOS: a GPU-drawn notch at the top of the screen"
license-file = "LICENSE"
readme = "README.md"
publish = false
rust-version = "1.82"

[dependencies]
windows-numerics = { package = "island-macos-numerics", path = "macos/windows-numerics" }
windows-core = { package = "island-macos-core", path = "macos/windows-core" }
windows = { package = "island-macos-windows", path = "macos/windows" }

[features]
# Галерея виджетов для проверки дизайна: `cargo run --features gallery -- --gallery <папка>`
# рисует все виджеты во всех размерах в PNG. В обычную сборку не входит.
gallery = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

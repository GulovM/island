[package]
name = "island"
version = "1.0.0"
edition = "2021"
description = "Dynamic island for Windows 10/11: a GPU-drawn notch at the top of the screen"
license = "MIT"
readme = "README.md"
publish = false
rust-version = "1.82"

[dependencies]
windows-numerics = "0.2"
windows-core = "0.61"
windows-collections = "0.2"
windows-future = "0.2"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_System_IO",
    "Win32_Globalization",
    "Win32_Networking_WinSock",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinHttp",
    "Win32_System_Performance",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Shutdown",
    "Win32_System_Variant",
    "Win32_Graphics_Imaging",
    "Devices_Radios",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "System",
    "Graphics",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
]

[features]
# Галерея виджетов для проверки дизайна: `cargo run --features gallery -- --gallery <папка>`
# рисует все виджеты во всех размерах в PNG. В обычную сборку не входит.
gallery = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
